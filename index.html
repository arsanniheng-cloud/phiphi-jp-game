<link rel="stylesheet" href="css/style.css?v=20261030">

<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="row">
    <span class="chip" id="h-date">กำลังโหลด…</span>
    <span class="chip" id="h-time"></span>
    <span class="chip" id="h-season"></span>
    <span class="chip focus" id="h-focus" hidden title="แผนงานวันนี้ (แตะเพื่อเปิดแผนงาน)"></span>
    <span class="chip" id="h-guests"></span>
    <span class="chip" id="h-staff"></span>
    <span class="chip safe" id="h-safe"></span>
    <span class="chip net" id="h-net" hidden title="ดูรหัสห้อง"></span>
  </div>
  <div class="meters">
    <div class="meter" id="m-ops"><span class="ic">🛎️</span><span class="tx">ความพร้อมบริการ</span><i></i><b>0</b></div>
    <div class="meter" id="m-guest"><span class="ic">😊</span><span class="tx">ความพึงพอใจแขก</span><i></i><b>0</b></div>
    <div class="meter" id="m-rep"><span class="ic">🦺</span><span class="tx">ความน่าเชื่อถือ จป.</span><i></i><b>0</b></div>
    <div class="meter" id="m-trust"><span class="ic">🤝</span><span class="tx">ความไว้ใจของพนักงาน</span><i></i><b>0</b></div>
  </div>
</div>

<div id="side">
  <canvas id="minimap" width="240" height="160" title="แตะแผนที่เพื่อเดินไป"></canvas>
  <div id="tools">
    <button data-ui="mapbtn" class="mob-only" aria-label="แผนที่"><span class="ic">🗺️</span><span class="tx">แผนที่</span></button>
    <button data-ui="staff" aria-label="พนักงาน"><span class="ic">👥</span><span class="tx">พนักงาน</span></button>
    <button data-ui="log" aria-label="สมุดบันทึก"><span class="ic">📋</span><span class="tx">บันทึก</span><em id="badge-log"></em></button>
    <button data-ui="ptw" aria-label="ใบอนุญาตทำงาน"><span class="ic">📝</span><span class="tx">PTW</span><em id="badge-ptw"></em></button>
    <button data-ui="plan" aria-label="แผนงาน ประชุม คปอ. และอบรม"><span class="ic">📅</span><span class="tx">แผนงาน</span><em id="badge-plan"></em></button>
    <button data-ui="menu" aria-label="เมนู"><span class="ic">☰</span><span class="tx">เมนู</span></button>
    <button data-ui="full" class="mob-only" aria-label="เต็มจอ"><span class="ic">⛶</span><span class="tx">เต็มจอ</span></button>
    <button data-ui="land" class="mob-only" aria-label="สลับแนวนอน/แนวตั้ง"><span class="ic">🔄</span><span class="tx">แนวนอน</span></button>
  </div>
</div>

<div id="feed"></div>
<div id="prompt"></div>
<div id="joy"><div id="stick"></div></div>
<button id="act" aria-label="โต้ตอบ"><span class="ic">✋</span><span class="tx">E</span></button>

<div id="panel" class="hidden"><div id="card"></div></div>
<div id="flash"></div>
<div id="errbox"></div>
<div id="loading"><div><b>กำลังสร้างเกาะพีพี…</b><span>วาดหน้าผาหินปูน ต้นมะพร้าว และพนักงาน 204 คน</span></div></div>
<input type="file" id="file-import" accept=".json,application/json" hidden>

<!-- ข้อมูล (ฐานข้อมูลของเกม แยกเป็นไฟล์ตามตาราง) -->

</body>
</html>
